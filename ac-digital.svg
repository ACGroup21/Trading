<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 134" role="img" aria-label="AC Digital">
  <title>AC Digital</title>
  <!-- Letterforms take currentColor so the mark sits on any ground; the dot and the
       wordmark carry the brand blue. A and C share a cap height and an optical
       centre line, as in the original. -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 14 L18 88"/>
    <path d="M46 14 L74 88"/>
    <path d="M145.5 26.2 A37 37 0 1 0 145.5 75.8"/>
  </g>
  <circle cx="46" cy="74" r="7.5" fill="#29A9E0"/>
  <text x="86" y="122" text-anchor="middle" fill="#29A9E0"
        font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="18" font-weight="400" letter-spacing="9">DIGITAL</text>
</svg>
